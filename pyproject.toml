[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ihaveajob"
version = "0.1.0"
description = "Open-source job intelligence platform: monitors career pages, scores relevance, extracts visa evidence, and sends alerts."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "PyYAML>=6.0",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
render = ["playwright>=1.45"]  # headless browser for JavaScript-built careers pages
dev = ["pytest>=8.0"]

[project.scripts]
ihaveajob = "ihaveajob.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ihaveajob = ["database/migrations/*.py", "database/migrations/versions/*.py", "database/migrations/*.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
