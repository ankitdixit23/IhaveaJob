# Monitored careers pages. ANY public careers page link works.
#
# Add one by pasting its URL (after searching/filtering the page for your field):
#   - GitHub: Actions -> "add careers page" -> Run workflow, or
#   - here: add "- url: <link>" under sources, or
#   - CLI:  ihaveajob add-source "<url>" [--keywords "climate,data"] [--locations "New York,Remote"]
#
# Only `url` is required. Optional fields:
#   name / company  display name (otherwise derived from the URL)
#   key             unique id (otherwise derived)
#   adapter         auto | workday | ashby | greenhouse | lever | google_careers | watershed
#                   (detected from the URL; "auto" = universal reader)
#   filters         applied by IhaveaJob; only matching jobs are emailed:
#                     keywords_any, keywords_exclude, departments, locations
#   enabled         false pauses a page without deleting its history
#
# This file is public. Don't put personal information or credentials here.

sources:
  - key: watershed
    company: Watershed
    adapter: watershed
    url: https://watershed.com/careers
    enabled: true
  - key: google-sustainability
    company: Google
    adapter: google_careers
    url: https://www.google.com/about/careers/applications/jobs/results?q=sustainability
    enabled: true
  - key: adobe
    company: Adobe
    adapter: auto
    url: https://careers.adobe.com/us/en/c/research-jobs
    enabled: true
